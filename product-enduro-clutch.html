<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enduro Clutch Spring — Motovictus</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style> body { font-family: 'Inter', sans-serif; } </style>
<!-- Favicon for browsers -->
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16x16.png">

<!-- Favicon for Safari / iOS -->
<link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png">

<!-- Optional: manifest for web apps -->
<link rel="manifest" href="site.webmanifest">

<!-- Optional: theme color for mobile browsers -->
<meta name="theme-color" content="#0a2540">
</head>
<body class="bg-gray-100 text-gray-800">
<div id="header" class="invisible"></div>

<main class="max-w-4xl mx-auto px-4 py-16">
<img src="images/enduro-clutch.jpg" alt="Enduro Clutch Spring" class="w-full aspect-square object-cover rounded mb-6">
<h1 class="text-3xl font-bold mb-4">Enduro Clutch Spring</h1>
<p class="text-lg mb-6">The Enduro Clutch Spring is designed for smoother clutch feel, improved modulation, and durability in extreme riding conditions.</p>

   target="_blank"
   class="bg-orange-500 hover:bg-orange-600 text-white px-6 py-3 rounded-lg font-bold">
   Buy Now
</a>
</main>


<div id="footer" class="invisible"></div>

<script>
  async function loadHTML(id, url) {
    const container = document.getElementById(id);
    const resp = await fetch(url);
    const html = await resp.text();
    container.innerHTML = html;
    container.classList.remove('invisible'); // show content after loading
  }

  // Load header and footer
  loadHTML('header', 'header.html').then(() => {
    // Mobile menu toggle script after header loads
    const menuBtn = document.getElementById('menu-btn');
    const mobileMenu = document.getElementById('mobile-menu');
    if(menuBtn && mobileMenu){
      menuBtn.addEventListener('click', () => {
        mobileMenu.classList.toggle('hidden');
        mobileMenu.classList.toggle('flex');
      });
    }
  });

  loadHTML('footer', 'footer.html');
</script>

<style>
  /* Prevent layout shift by reserving space */
  #header, #footer {
    transition: opacity 0.2s ease-in-out;
  }
</style>

</body>
</html>
